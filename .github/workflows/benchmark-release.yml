name: benchmark-release

# Merge to `release` -> measure -> publish -> merge `release` back to `main`.
#
# GitHub Pages serves libviprs.org from `main` at `/`, so the merge back to main
# at the end is the step that actually publishes. Everything before it is what
# earns the right to.
#
# ---------------------------------------------------------------------------
# THE ONE THING TO UNDERSTAND BEFORE EDITING THIS FILE
#
# A benchmark cannot be measured on a GitHub-hosted runner and published. Not
# "should not": the publish path refuses it, on purpose, and it is right to.
#
#   * `tools/publish/import-run.mjs` refuses a run whose cells were mostly
#     measured under contention, on the cause (`machineLoad.quiet`) rather than
#     on the consequence. A hosted runner is a shared virtual machine with
#     neighbours nobody can see.
#   * It refuses a run whose emulation probe is anything but exactly `false`,
#     absent included. The published PMTiles numbers this epic replaced were
#     almost certainly Rosetta and nothing recorded it.
#   * It refuses a run that is not in an archive index by digest, because a
#     document sitting in a working directory is not citable.
#
# And the numbers would not be worth having even if it let them through. On a
# dedicated, quiet, native host the storage replicate control still disagrees
# with itself by a median of about 50% across one sweep. On a hosted runner that
# floor would be larger than anything it was trying to measure.
#
# So the measuring happens on the measurement host and nowhere else. The
# `capture` job below runs on a self-hosted runner that can reach it, and it
# will not fall back to a hosted one: a misconfigured repository gets a red run
# saying what is missing, never a green run publishing noise.
# ---------------------------------------------------------------------------
#
# Its own file, not a job in ci.yml, for two reasons that are both concrete.
# Adding a job to ci.yml reddens the Hook Mirror guard in
# libviprs-tests/tools/install-hooks.sh unless it is mirrored or deferred there
# in the same wave. And ci.yml declares `permissions: contents: read`, while
# this needs write to push a branch and open a pull request; folding it in would
# widen the permissions of every gate job in the repository to get one of them a
# token it alone needs. cli-resync.yml is the precedent for both.
#
# ---------------------------------------------------------------------------
# WHY THE LAST STEP IS A PULL REQUEST AND NOT A PUSH
#
# `main` is protected with seven required contexts (sync, extract, test-flags,
# gen-op-sections, bench-drift, msrv, links). A push straight to main is
# refused, and a token that bypasses protection would mean the regenerated page
# reaches the live site without the gates that exist to check it. So the merge
# back goes through a pull request, the required checks run on it, and it merges
# when they are green.
#
# Two settings this depends on, both owner actions, both checked at the top of
# the publish job rather than discovered at the end of it:
#
#   * `BENCH_RELEASE_TOKEN`, a fine-grained PAT scoped to this repository with
#     Contents and Pull requests read/write. A branch pushed with GITHUB_TOKEN
#     does not start a workflow run, so without it the PR carries no check runs
#     and there is nothing to merge on. This is the same trap cli-resync.yml
#     documents in its header; the difference is that here the checks are the
#     whole point, so this workflow refuses rather than falling back.
#   * Repository "Allow auto-merge" is currently OFF
#     (`allow_auto_merge: false`), so `gh pr merge --auto` is not available and
#     this waits on the checks itself with a bounded timeout.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      profile:
        description: >-
          Which sweep to capture. `full` is the publishable one. `ci` proves the
          harness runs, is never a measurement, and the importer refuses it.
        type: choice
        options: [full, xl]
        default: full
      capture:
        description: >-
          Take a fresh capture on the measurement host. Turn this off to publish
          a document that was already captured and archived by hand, which is
          the normal route while there is no self-hosted runner.
        type: boolean
        default: true
      allow_unchecked_merge:
        description: >-
          Merge the pull request without waiting for the required checks. For
          the documented case where Actions is disabled and the gates were run
          locally instead. Off by default, and a run that uses it says so in the
          pull request body.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Two release merges would race on the same branch, the same pull request and
  # the same measurement host.
  group: benchmark-release
  cancel-in-progress: false

env:
  BENCH_REPO: libviprs/libviprs-bench
  PROFILE: ${{ inputs.profile || 'full' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Can this run measure anything, and does it need to?
  #
  # Separate from the capture so a misconfigured repository fails in ten seconds
  # on a hosted runner with a readable message, rather than queueing forever
  # against a self-hosted label that does not exist.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      capture: ${{ steps.decide.outputs.capture }}
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - name: Decide whether to capture, and on what
        id: decide
        env:
          WANT: ${{ inputs.capture == null && 'true' || inputs.capture }}
          RUNNER_LABEL: ${{ vars.BENCH_RUNNER_LABEL }}
        run: |
          set -euo pipefail
          if [ "$WANT" != "true" ]; then
            echo "capture=no" >> "$GITHUB_OUTPUT"
            echo "runner=none" >> "$GITHUB_OUTPUT"
            echo "Capture turned off for this run. The publish job will import whatever archived document"
            echo "the benchmark repository already carries, and refuse if there is nothing publishable."
            exit 0
          fi
          if [ -z "${RUNNER_LABEL:-}" ]; then
            echo "::error::A capture was asked for and no BENCH_RUNNER_LABEL repository variable is set, so there is no runner that can reach the measurement host. This workflow will not fall back to a GitHub-hosted runner: a hosted runner is shared and virtualised, the importer refuses a run measured under contention, and the numbers would not be worth having if it did not. Set BENCH_RUNNER_LABEL to the label of a self-hosted runner with access to the measurement host, or dispatch this workflow with capture=false to publish an already-archived document."
            exit 1
          fi
          echo "capture=yes" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER_LABEL" >> "$GITHUB_OUTPUT"
          echo "Capturing on self-hosted runner '$RUNNER_LABEL' at profile ${PROFILE}."

  # ---------------------------------------------------------------------------
  # 2. Measure, on the measurement host.
  #
  # `tools/capture-nas.sh` does the whole thing and leaves the machine as it
  # found it: it pushes the tree with `.git` (without it the provenance layer
  # cannot resolve a commit and the aggregator refuses the run), runs every
  # command in a throw-away container including the ones that do not feel like
  # work, retrieves with `ssh cat` because the SFTP subsystem is not available
  # there, and cleans up on a trap.
  #
  # It does not archive. Archiving is a separate, deliberate step, because the
  # archive is what makes a number citable and putting it on the end of a
  # capture would make it automatic.
  # ---------------------------------------------------------------------------
  capture:
    needs: preflight
    if: needs.preflight.outputs.capture == 'yes'
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 180
    steps:
      - name: Check out libviprs-bench
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCH_REPO }}
          path: bench
          # The capture pushes the tree WITH .git to the measurement host, and
          # the provenance layer resolves the commit out of it. A shallow clone
          # resolves nothing and the aggregator refuses the run.
          fetch-depth: 0

      - name: Refuse a profile that is not publishable
        working-directory: bench
        run: |
          set -euo pipefail
          case "$PROFILE" in
            full|xl) echo "profile $PROFILE is publishable" ;;
            *) echo "::error::profile '$PROFILE' is not publishable. 'ci' proves the harness runs, is never a measurement, and archives indistinguishably from a real one, which is why the importer refuses it. Nothing should be able to reach the site through it."; exit 1 ;;
          esac

      - name: Capture both families natively
        working-directory: bench
        run: tools/capture-nas.sh --profile "$PROFILE" --out "$GITHUB_WORKSPACE/capture"

      - name: Archive the documents by digest
        working-directory: bench
        run: |
          set -euo pipefail
          # The archive is the thing that makes a number citable: it indexes a
          # document against its digests under a run id. `storage-aggregate` is
          # the only door into it, it refuses rather than reports, and a refusal
          # is exit 1 because it is an answer and not a failure to run.
          #
          # One binary for both families, and `--root` is the BASE directory:
          # the family subdirectory is derived from the document's own `family`
          # field, precisely so an engines document cannot be filed under
          # archive/storage where the next storage run would start in the middle
          # of it.
          #
          # --check first, so a document that is going to be refused is refused
          # before the archive is touched, and the reasons land in their own log
          # group rather than inside a failed --archive.
          admitted=0
          for family in storage engines; do
            doc="$GITHUB_WORKSPACE/capture/${family}-x86.json"
            if [ ! -f "$doc" ]; then
              echo "::error::the capture produced no document for the $family family at $doc"
              exit 1
            fi
            echo "::group::$family: would this be archived?"
            if ! cargo run --quiet --bin storage-aggregate -- --check "$doc"; then
              echo "::endgroup::"
              echo "::warning::the $family document was refused at the archive door; it is not archived and will not be published"
              continue
            fi
            echo "::endgroup::"
            cargo run --quiet --bin storage-aggregate -- --archive "$doc" --root archive
            admitted=$((admitted + 1))
          done
          if [ "$admitted" -eq 0 ]; then
            echo "::error::neither family was admissible, so this capture archived nothing. The reasons are in the groups above; a contended, emulated or dirty run is exactly what that door exists to stop."
            exit 1
          fi
          echo "archived $admitted document(s)"

      - name: Keep the archived documents for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-archive
          path: bench/archive/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Publish: import, regenerate, gate, commit to `release`, and open the
  #    merge back to `main`.
  #
  # Nothing here measures anything, so it runs on a hosted runner quite happily.
  # It imports a document that was already archived by digest somewhere else,
  # which is the whole point of the archive.
  # ---------------------------------------------------------------------------
  publish:
    needs: [preflight, capture]
    # `always()` because the capture job is skipped on a publish-only run, and a
    # skipped dependency would otherwise skip this too. The failure() arm keeps
    # a failed capture from publishing anything.
    if: always() && needs.preflight.result == 'success' && needs.capture.result != 'failure' && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to start without the token the merge back needs
        env:
          BENCH_RELEASE_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BENCH_RELEASE_TOKEN:-}" ]; then
            echo "::error::BENCH_RELEASE_TOKEN is not set. A branch pushed with GITHUB_TOKEN does not start a workflow run, so the pull request this opens would carry none of main's seven required checks and there would be nothing to merge on. Checked here rather than after a three-hour capture. Set a fine-grained PAT scoped to this repository with Contents and Pull requests read/write."
            exit 1
          fi
          echo "token present"

      - name: Check out libviprs-org at the release branch
        uses: actions/checkout@v4
        with:
          path: libviprs-org
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # Without this, actions/checkout leaves the token in .git/config as an
          # http.extraheader for the whole job, including the steps that run the
          # generators. The push step re-attaches it for as long as it needs it.
          persist-credentials: false
          token: ${{ secrets.BENCH_RELEASE_TOKEN }}

      - name: Check out libviprs-bench
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCH_REPO }}
          path: bench
          fetch-depth: 0

      - name: Take the archived documents from the capture, if there was one
        if: needs.capture.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: benchmark-archive
          path: bench/archive/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every archived document that is newer than what the history already
      # carries. The importer decides what is publishable, one document at a
      # time, and reports every reason rather than the first. Re-importing a run
      # that is already in the history replaces its entry rather than appending
      # a second copy, so this is safe to re-run.
      - name: Import every archived document the history does not have
        id: import
        run: |
          set -euo pipefail
          imported=0
          refused=0
          for family in storage engines; do
            index="bench/archive/${family}/index.json"
            [ -f "$index" ] || { echo "no archive index for $family, skipping"; continue; }
            for file in $(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('$index','utf8')).map(e=>e.file).join('\n'))"); do
              doc="bench/archive/${family}/${file}"
              echo "::group::$family $file"
              if node bench/tools/publish/import-run.mjs \
                   --document "$doc" \
                   --archive "bench/archive/${family}" \
                   --history libviprs-org/benchmarks/history.json; then
                imported=$((imported + 1))
              else
                # A refusal is a result, not an error. A document that cannot be
                # published is exactly what the gates are for, and a run that
                # refuses everything is caught below rather than here.
                echo "::warning::$family $file was refused; see the reasons above"
                refused=$((refused + 1))
              fi
              echo "::endgroup::"
            done
          done
          echo "imported=$imported" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          if [ "$imported" -eq 0 ]; then
            echo "::error::nothing was publishable: $refused document(s) refused and none imported. An empty reading is a refusal and not a result, so this stops here rather than opening a pull request that changes nothing."
            exit 1
          fi
          echo "imported $imported document(s), refused $refused"

      - name: Regenerate the page from the history
        working-directory: libviprs-org
        run: node benchmarks/tools/render-latest.mjs

      # The same gates the required contexts run, before anything is committed.
      # A regeneration that cannot satisfy them is a report, not a patch.
      - name: Run the gates this change has to satisfy
        working-directory: libviprs-org
        run: |
          set -euo pipefail
          node benchmarks/tools/render-latest.mjs --check
          node benchmarks/tools/render-latest.test.mjs
          node tools/site-checks/links.js
          node tools/site-checks/page-split.test.js
          node benchmarks/tools/bench-drift.js
          node benchmarks/tools/bench-drift.test.js

      - name: Commit the regenerated page to the release branch
        id: commit
        working-directory: libviprs-org
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          IMPORTED: ${{ steps.import.outputs.imported }}
          REFUSED: ${{ steps.import.outputs.refused }}
        run: |
          set -euo pipefail
          git config user.name "libviprs-org benchmarks"
          git config user.email "noreply@github.com"
          # Named paths. The import and the render touch exactly these two, and
          # a wildcard here would sweep whatever else a capture left in the tree.
          git add benchmarks/history.json benchmarks/index.html
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "the regenerated page is identical to what is committed; nothing to publish"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          runs=$(node -e "const h=require('./benchmarks/history.json'); process.stdout.write(h.map(r=>r.family+' '+r.runId).join('\n  '))")
          git commit -m "benchmarks: publish $IMPORTED newly archived run(s)

          Imported through libviprs-bench tools/publish/import-run.mjs, which
          recomputes the four integrity digests rather than trusting them and
          refuses a run that is emulated, contended, dirty, unarchived or on a
          profile that is not publishable. $REFUSED document(s) were refused on
          this run and are not on the page.

          The history now carries:
            $runs"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ---------------------------------------------------------------------
      # The merge back to main. This is what puts the page on libviprs.org:
      # Pages serves main at /, so until this lands the regenerated page exists
      # only on the release branch.
      # ---------------------------------------------------------------------
      - name: Open the merge back into main
        id: pr
        if: steps.commit.outputs.changed == '1'
        working-directory: libviprs-org
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          IMPORTED: ${{ steps.import.outputs.imported }}
          REFUSED: ${{ steps.import.outputs.refused }}
          UNCHECKED: ${{ inputs.allow_unchecked_merge }}
        run: |
          set -euo pipefail
          title="benchmarks: publish ${IMPORTED} newly archived run(s)"
          note=""
          if [ "${UNCHECKED:-false}" = "true" ]; then
            note="

          **This run was dispatched with \`allow_unchecked_merge\`,** so it merges without waiting for the required contexts. The gates above ran inside the job that opened this, which is the same set, but they ran on a hosted runner against the same tree rather than as the check runs branch protection reads."
          fi
          body="Opened by \`.github/workflows/benchmark-release.yml\` after a merge to \`release\`.

          ${IMPORTED} archived run(s) imported, ${REFUSED} refused. Every number on \`/benchmarks/\` comes from a document that was archived by digest before it was published, and the importer recomputes those digests rather than trusting them.

          These gates ran in the job that opened this, before anything was committed:

          - \`render-latest.mjs --check\`
          - \`render-latest.test.mjs\`
          - \`tools/site-checks/links.js\` and \`page-split.test.js\`
          - \`benchmarks/tools/bench-drift.js\` and its test

          GitHub Pages serves \`main\` at \`/\`, so merging this is what publishes the page.${note}"

          existing="$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "updated the open release PR #$existing"
          else
            gh pr create --base main --head "${GITHUB_REF_NAME}" --title "$title" --body "$body"
            echo "number=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the required checks, then merge
        if: steps.commit.outputs.changed == '1'
        working-directory: libviprs-org
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          UNCHECKED: ${{ inputs.allow_unchecked_merge }}
        run: |
          set -euo pipefail
          if [ "${UNCHECKED:-false}" = "true" ]; then
            echo "::warning::merging without waiting for the required contexts, because this run was dispatched with allow_unchecked_merge"
            gh pr merge "$PR" --merge --delete-branch=false
            echo "merged #$PR"
            exit 0
          fi
          # Auto-merge is off on this repository (`allow_auto_merge: false`), so
          # `gh pr merge --auto` is not available and this waits itself. The
          # timeout is bounded: a run that hangs here forever is a run nobody
          # notices has stopped.
          if ! timeout 45m gh pr checks "$PR" --watch --fail-fast; then
            echo "::error::the required checks on #$PR did not go green, so the regenerated page is not being merged to main. The branch and the pull request are both intact; nothing is lost. If Actions is disabled and the checks cannot run at all, re-dispatch this workflow with capture=false and allow_unchecked_merge=true after running the gates locally."
            exit 1
          fi
          gh pr merge "$PR" --merge --delete-branch=false
          echo "merged #$PR into main; Pages will serve the regenerated page from main"

      - name: A failure has to be visible somewhere other than the Actions tab
        if: failure()
        continue-on-error: true
        working-directory: libviprs-org
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="benchmark-release is failing"
          body="\`.github/workflows/benchmark-release.yml\` failed, so a merge to \`release\` did not reach \`main\` and the published benchmark page is not current.

          Last failing run: $RUN_URL

          The likeliest causes, in the order they bite:

          - **no capture runner.** \`BENCH_RUNNER_LABEL\` is unset, so there is nowhere to measure. Dispatch with \`capture=false\` to publish an already-archived document instead.
          - **nothing publishable.** Every archived document was refused. The reasons are in the import step's log, one per document, and a refusal is a result rather than a bug: a contended, emulated or unarchived run is exactly what those gates exist to stop.
          - **the checks did not go green.** The regenerated page is committed to \`release\` and the pull request is open; nothing is lost.

          This issue is opened once and its body is rewritten on each later failure, so it stays a single thread. Close it when the run is green."
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
