name: benchmark-release

# Merge to `release` -> ingest -> publish -> merge `release` back to `main`.
#
# GitHub Pages serves libviprs.org from `main` at `/`, so the merge back to main
# at the end is the step that actually publishes. Everything before it is what
# earns the right to.
#
# ---------------------------------------------------------------------------
# THIS WORKFLOW NO LONGER MEASURES ANYTHING, AND THAT IS THE POINT
#
# A benchmark cannot be measured on a GitHub-hosted runner and published. Not
# "should not": the publish path refuses it, on purpose, and it is right to.
#
#   * the importer refuses a run whose cells were mostly measured under
#     contention, on the cause (`machineLoad.quiet`) rather than on the
#     consequence. A hosted runner is a shared virtual machine with neighbours
#     nobody can see.
#   * it refuses a run whose emulation probe is anything but exactly `false`,
#     absent included. The published PMTiles numbers this epic replaced were
#     almost certainly Rosetta and nothing recorded it.
#   * it refuses a run that is not in an archive index by digest, because a
#     document sitting in a working directory is not citable.
#
# And the numbers would not be worth having even if it let them through. On a
# dedicated, quiet, native host the storage replicate control still disagrees
# with itself by a median of about 50% across one sweep. On a hosted runner that
# floor would be larger than anything it was trying to measure.
#
# This file used to work around that with a `capture` job on a self-hosted
# runner that refused to fall back. The simpler and more honest shape is the one
# it has now: measuring happens on the measurement host, driven from a person's
# machine by `tools/capture.py` in libviprs-bench, and what reaches this
# repository is an already-archived, already-imported, digest-verified history.
# CI verifies and publishes. It does not measure.
#
# ---------------------------------------------------------------------------
# WHAT IT DOES NOW
#
# `benchmarks/BENCH_REV` pins one libviprs-bench commit, and
# `benchmarks/history.json` is a frozen copy of that revision's
# `tools/publish/history.json`. This workflow moves the pin, syncs the copy,
# regenerates the page from it, and opens the merge back into main.
#
# The pin is deliberate rather than a follow-main. Following main would mean a
# capture publishes itself with no commit here, and "which benchmark revision is
# this page showing" would stop being answerable from this repository alone. The
# cost is that somebody has to bump it, and this workflow is that somebody: a
# dispatch with `bench_rev` moves it, and a plain merge to `release` republishes
# whatever the branch already pins.
#
# Its own file, not a job in ci.yml, for two reasons that are both concrete.
# Adding a job to ci.yml reddens the Hook Mirror guard in
# libviprs-tests/tools/install-hooks.sh unless it is mirrored or deferred there
# in the same wave. And ci.yml declares `permissions: contents: read`, while
# this needs write to push a branch and open a pull request; folding it in would
# widen the permissions of every gate job in the repository to get one of them a
# token it alone needs. cli-resync.yml is the precedent for both.
#
# ---------------------------------------------------------------------------
# WHY THE LAST STEP IS A PULL REQUEST AND NOT A PUSH
#
# `main` is protected with seven required contexts (sync, extract, test-flags,
# gen-op-sections, bench-drift, msrv, links). A push straight to main is
# refused, and a token that bypasses protection would mean the regenerated page
# reaches the live site without the gates that exist to check it. So the merge
# back goes through a pull request, the required checks run on it, and it merges
# when they are green.
#
# Two settings this depends on, both owner actions, both checked at the top of
# the job rather than discovered at the end of it:
#
#   * `BENCH_RELEASE_TOKEN`, a fine-grained PAT scoped to this repository with
#     Contents and Pull requests read/write. A branch pushed with GITHUB_TOKEN
#     does not start a workflow run, so without it the PR carries no check runs
#     and there is nothing to merge on. This is the same trap cli-resync.yml
#     documents in its header; the difference is that here the checks are the
#     whole point, so this workflow refuses rather than falling back.
#   * Repository "Allow auto-merge" is currently OFF
#     (`allow_auto_merge: false`), so `gh pr merge --auto` is not available and
#     this waits on the checks itself with a bounded timeout.
#
# Reading libviprs-bench needs no secret at all: all nine org repos are public
# and `github.token` reaches it, which libviprs-org#72 established when the
# `SYNC_CLI_TOKEN` the CLI sync was believed to need turned out never to have
# existed.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      bench_rev:
        description: >-
          The libviprs-bench commit to publish from, as a full 40-character sha.
          Leave empty to republish whatever benchmarks/BENCH_REV already pins,
          which is what a plain merge to `release` does.
        type: string
        required: false
      allow_unchecked_merge:
        description: >-
          Merge the pull request without waiting for the required checks. For
          the documented case where Actions is disabled and the gates were run
          locally instead. Off by default, and a run that uses it says so in the
          pull request body.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Two release merges would race on the same branch and the same pull request.
  group: benchmark-release
  cancel-in-progress: false

env:
  BENCH_REPO: libviprs/libviprs-bench

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to start without the token the merge back needs
        env:
          BENCH_RELEASE_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BENCH_RELEASE_TOKEN:-}" ]; then
            echo "::error::BENCH_RELEASE_TOKEN is not set. A branch pushed with GITHUB_TOKEN does not start a workflow run, so the pull request this opens would carry none of main's seven required checks and there would be nothing to merge on. Set a fine-grained PAT scoped to this repository with Contents and Pull requests read/write."
            exit 1
          fi
          echo "token present"

      - name: Check out libviprs-org at the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # Without this, actions/checkout leaves the token in .git/config as an
          # http.extraheader for the whole job, including the steps that run the
          # generators. The push step passes it on its own command line instead,
          # so it never goes back into that file.
          persist-credentials: false
          token: ${{ secrets.BENCH_RELEASE_TOKEN }}

      - name: Decide which libviprs-bench revision this publishes
        id: pin
        env:
          REQUESTED: ${{ inputs.bench_rev }}
        run: |
          set -euo pipefail
          rev="${REQUESTED:-$(tr -d '[:space:]' < benchmarks/BENCH_REV)}"
          if ! printf '%s' "$rev" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'$rev' is not a full 40-character libviprs-bench commit sha. A short sha is ambiguous and a branch name is not a pin at all, which is the whole reason this site pins rather than following main."
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          if [ -n "${REQUESTED:-}" ]; then
            echo "moving the pin to $rev"
          else
            echo "republishing the pinned $rev"
          fi

      - name: Check out libviprs-bench at that revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCH_REPO }}
          ref: ${{ steps.pin.outputs.rev }}
          path: bench
          # The ingest reads every file with `git show <rev>:<path>` rather than
          # out of the working tree, so the objects have to be here.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Verify the origin, take the history, regenerate the page, and check
      # itself, in one command. It refuses before it writes anything, so a
      # revision whose history is not backed by its own archive leaves the page
      # exactly as it was and says why.
      - name: Ingest the pinned history and regenerate the page
        run: node benchmarks/tools/ingest.mjs --bench bench --sync --rev "${{ steps.pin.outputs.rev }}"

      # The same gates the required contexts run, before anything is committed.
      # A regeneration that cannot satisfy them is a report, not a patch.
      - name: Run the gates this change has to satisfy
        run: |
          set -euo pipefail
          node benchmarks/tools/ingest.mjs --bench bench --check
          node benchmarks/tools/render-latest.mjs --check
          node benchmarks/tools/render-latest.test.mjs
          node tools/site-checks/links.js
          node tools/site-checks/page-split.test.js
          node benchmarks/tools/bench-drift.js
          node benchmarks/tools/bench-drift.test.js

      - name: Commit the regenerated page to the release branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          REV: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          git config user.name "libviprs-org benchmarks"
          git config user.email "noreply@github.com"
          # Named paths. The ingest touches exactly these three, and a wildcard
          # here would sweep whatever else the job left in the tree.
          git add benchmarks/BENCH_REV benchmarks/history.json benchmarks/index.html
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "the regenerated page is identical to what is committed; nothing to publish"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          runs=$(node -e "const h=require('./benchmarks/history.json'); process.stdout.write(h.map(r=>r.family+' '+r.runId).join('\n  '))")
          git commit -m "benchmarks: publish libviprs-bench ${REV}

          The history on this page is a frozen copy of that revision's
          tools/publish/history.json, and every entry in it was joined to an
          archived document at the same revision with its four integrity digests
          recomputed rather than trusted.

          The history now carries:
            $runs"
          # Pushed with the credential on the command line rather than written
          # into .git/config. `persist-credentials: false` on the checkout exists
          # to keep the token out of that file, and `git remote set-url` put it
          # straight back, where it then sat through `gh pr create` and through a
          # `gh pr checks --watch` that can run forty-five minutes.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"

      # ---------------------------------------------------------------------
      # The merge back to main. This is what puts the page on libviprs.org:
      # Pages serves main at /, so until this lands the regenerated page exists
      # only on the release branch.
      # ---------------------------------------------------------------------
      - name: Open the merge back into main
        id: pr
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          REV: ${{ steps.pin.outputs.rev }}
          UNCHECKED: ${{ inputs.allow_unchecked_merge }}
        run: |
          set -euo pipefail
          title="benchmarks: publish libviprs-bench ${REV:0:12}"
          note=""
          if [ "${UNCHECKED:-false}" = "true" ]; then
            note="

          **This run was dispatched with \`allow_unchecked_merge\`,** so it merges without waiting for the required contexts. The gates above ran inside the job that opened this, which is the same set, but they ran on a hosted runner against the same tree rather than as the check runs branch protection reads."
          fi
          body="Opened by \`.github/workflows/benchmark-release.yml\` after a merge to \`release\`.

          The page is regenerated from libviprs-bench \`${REV}\`. Nothing here measured anything: the capture happens on the measurement host through \`tools/capture.py\` in that repository, and what this reads is an already-archived, already-imported history. Every entry was joined to an archived document at that revision and its four integrity digests were recomputed rather than trusted.

          These gates ran in the job that opened this, before anything was committed:

          - \`ingest.mjs --check\`
          - \`render-latest.mjs --check\`
          - \`render-latest.test.mjs\`
          - \`tools/site-checks/links.js\` and \`page-split.test.js\`
          - \`benchmarks/tools/bench-drift.js\` and its test

          GitHub Pages serves \`main\` at \`/\`, so merging this is what publishes the page.${note}"

          existing="$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "updated the open release PR #$existing"
          else
            gh pr create --base main --head "${GITHUB_REF_NAME}" --title "$title" --body "$body"
            echo "number=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the required checks, then merge
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.BENCH_RELEASE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          UNCHECKED: ${{ inputs.allow_unchecked_merge }}
        run: |
          set -euo pipefail
          if [ "${UNCHECKED:-false}" = "true" ]; then
            echo "::warning::merging without waiting for the required contexts, because this run was dispatched with allow_unchecked_merge"
            gh pr merge "$PR" --merge --delete-branch=false
            echo "merged #$PR"
            exit 0
          fi
          # Auto-merge is off on this repository (`allow_auto_merge: false`), so
          # `gh pr merge --auto` is not available and this waits itself. The
          # timeout is bounded: a run that hangs here forever is a run nobody
          # notices has stopped.
          if ! timeout 45m gh pr checks "$PR" --watch --fail-fast; then
            echo "::error::the required checks on #$PR did not go green, so the regenerated page is not being merged to main. The branch and the pull request are both intact; nothing is lost. If Actions is disabled and the checks cannot run at all, re-dispatch this workflow with allow_unchecked_merge=true after running the gates locally."
            exit 1
          fi
          gh pr merge "$PR" --merge --delete-branch=false
          echo "merged #$PR into main; Pages will serve the regenerated page from main"

      - name: A failure has to be visible somewhere other than the Actions tab
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="benchmark-release is failing"
          body="\`.github/workflows/benchmark-release.yml\` failed, so a merge to \`release\` did not reach \`main\` and the published benchmark page is not current.

          Last failing run: $RUN_URL

          The likeliest causes, in the order they bite:

          - **the pinned revision's history is not backed by its own archive.** The ingest refuses an entry no archived document supports, and that is a result rather than a bug: it is the state the page was in before this existed. Capture again with \`tools/capture.py\` in libviprs-bench and pin the commit that publishes.
          - **the pin is not a full sha.** A short sha is ambiguous and a branch name is not a pin.
          - **the checks did not go green.** The regenerated page is committed to \`release\` and the pull request is open; nothing is lost.

          This issue is opened once and its body is rewritten on each later failure, so it stays a single thread. Close it when the run is green."
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
