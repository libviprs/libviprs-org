name: ci

# SCHEMA_V2 §5 — the docs-generator gates, all required on `main`:
#   1. sync           — the frozen CLI copy is byte-identical to canonical libviprs-cli
#   2. extract        — the extractor regenerates snippets.generated.json with no drift
#                       (enforces the pyramid baseline §4 internally) + unit tests
#   3. test-flags     — every flag still produces a code diff (per-flag audit) + anchors
#   4. gen-op-sections— the data-driven op sections regenerate with no drift, and the
#                       oracle_class/shape enums validate
#
# Plus one gate that is NOT a docs-generator gate and is not in SCHEMA_V2:
#   5. msrv           — the Rust floor this site advertises matches the floor
#                       libviprs actually declares (libviprs#608)
#
# The repo pins the CLI SHA it synced from via CLI_COUNTERPART_REV (§7); the sync
# gate checks out libviprs-cli at that ref. When libviprs-cli is not available to
# the workflow the sync check is SKIPPED at the step level (§5.1) — the job still
# reports (green on skip, red on real drift), and the other gates always run
# against the committed frozen copy. This single workflow subsumes the retired
# cli-sync.yml (B6): no two workflows race the same triggers.

on:
  # No path filter: SCHEMA_V2 §5 makes these jobs REQUIRED checks on `main`, so
  # a PR that doesn't touch cli/** must still run them — otherwise the required
  # contexts sit perpetually 'Expected' and the PR can never merge. The jobs are
  # cheap, so they run on every push (B7).
  #
  # Every branch, not just `main`: a push to a PR branch has to produce a run,
  # and `pull_request` on its own does not fire while a PR is conflicted with
  # its base, which is exactly when a signal is wanted (libviprs/libviprs#585).
  push:
    branches: ['**']
  # Daily drift sweep (converged from the retired cli-sync.yml, B6): catches an
  # upstream flag rename in libviprs-cli even when no push lands in this repo.
  # The Gitea migration dropped this as GitHub-native; it is back.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. sync — byte-identical frozen copy check. This is a BLOCKING gate: the
  #    CLI-absent case is handled at the STEP level (the checkout_cli step is
  #    continue-on-error, and the drift assertion is guarded by
  #    `if: steps.checkout_cli.outcome == 'success'`), so CLI-unavailable skips
  #    green while CLI-present + drift fails the job red. A job-level
  #    continue-on-error would make the whole gate non-blocking — always
  #    reporting success even on real drift (B1).
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out libviprs-org (this repo)
        uses: actions/checkout@v4
        with:
          path: libviprs-org

      - name: Check out canonical libviprs-cli (sibling)
        id: checkout_cli
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: libviprs/libviprs-cli
          path: libviprs-cli
          # Pin to the counterpart revision this doc site synced from.
          ref: ${{ vars.CLI_COUNTERPART_REV || '' }}
          token: ${{ secrets.SYNC_CLI_TOKEN || github.token }}

      - name: Assert frozen CLI copy is in sync
        if: steps.checkout_cli.outcome == 'success'
        run: libviprs-org/cli/tools/sync-cli-src.sh --check

      - name: Skip note (canonical CLI unavailable)
        if: steps.checkout_cli.outcome != 'success'
        run: echo "::warning::libviprs-cli not available to this workflow; skipping byte-identical sync check."

  # 2. extract — regenerate the manifest (baseline §4 enforced inside the
  #    extractor) and assert no uncommitted drift; then the per-flag audit.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate snippet manifest (enforces pyramid baseline §4)
        run: cargo run --manifest-path cli/tools/extract-snippets/Cargo.toml

      - name: Assert committed JSON matches regeneration (no drift)
        run: git diff --exit-code cli/js/snippets.generated.json

      - name: Extractor unit tests
        working-directory: cli/tools/extract-snippets
        run: cargo test --quiet

  # 3. test-flags — per-flag audit gate (exit 1 if any flag produces zero diff).
  test-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Per-flag audit
        run: node cli/tools/test-flags/test.js

      - name: Flag-anchor test
        run: node cli/tools/test-flags/anchors.js

  # 4. gen-op-sections — regenerate the data-driven op sections and assert no
  #    drift (same no-drift pattern as the extract gate). Running the generator
  #    also exercises the oracle_class/shape enum validation (B5, B8), so an
  #    invalid dump fails the job.
  gen-op-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate op sections (validates oracle_class/shape enums)
        run: node cli/tools/gen-op-sections/index.js --out cli/tools/gen-op-sections/generated-op-sections.html

      - name: Assert committed HTML matches regeneration (no drift)
        run: git diff --exit-code cli/tools/gen-op-sections/generated-op-sections.html

      - name: Placeholder substitution — annotated op bodies render real values (#53)
        run: node cli/tools/gen-op-sections/placeholder-substitution.test.js

  # 5. msrv — this site states the Rust floor of a crate that lives in another
  #    repo, and nothing checked the two against each other. Both statements
  #    said 1.85 while libviprs has declared `rust-version = "1.97"` for a
  #    while, so the front page was promising a toolchain the crate cannot be
  #    built on (libviprs#608). No Rust is installed here on purpose: this is a
  #    grep over the rendered HTML, because the number on a docs site is prose
  #    rather than a manifest field, and the only thing that can settle it is
  #    the core's own `rust-version`. Clone unauthenticated like libviprs-cli's
  #    guard does (libviprs-cli#44), since libviprs is public and GITHUB_TOKEN
  #    is scoped to this repository. The daily schedule above means a floor
  #    raised in libviprs turns this red within a day, with no push here.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone libviprs (source of truth for the Rust floor)
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs

      - name: Every advertised Rust version matches libviprs
        run: |
          core=$(grep -m1 -E '^rust-version *= *"' ../libviprs/Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/' | cut -d. -f1,2)
          advertised=$(grep -rhoE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' --include='*.html' . \
            | grep -oE '[0-9]+\.[0-9]+' | sort -u | paste -sd/ -)
          echo "core (libviprs):    $core"
          echo "advertised (pages): $advertised"
          echo "stated in:"
          grep -rlE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' --include='*.html' . | sort | sed 's/^/  /'
          rc=0
          [ -n "$advertised" ] || { echo "::error::no Rust version found in any page, so this guard has nothing to compare"; rc=1; }
          [ "$advertised" = "$core" ] || { echo "::error::this site advertises Rust $advertised+ but libviprs declares rust-version $core"; rc=1; }
          exit $rc
