name: ci

# Every job here is a REQUIRED check on `main` (libviprs-org#59). Four of them
# are the SCHEMA_V2 §5 docs-generator gates and two are not, which is worth
# keeping straight: §5 specifies the docs-generator contract, so listing all six
# under it would widen what that section claims to cover.
#
# SCHEMA_V2 §5 docs-generator gates:
#   1. sync           — the frozen CLI copy is byte-identical to canonical libviprs-cli
#   2. extract        — the extractor regenerates snippets.generated.json with no drift
#                       (enforces the pyramid baseline §4 internally) + unit tests
#   3. test-flags     — every flag still produces a code diff (per-flag audit) + anchors
#   4. gen-op-sections— the data-driven op sections regenerate with no drift, and the
#                       oracle_class/shape enums validate
#
# Required, but outside §5:
#   5. bench-drift    — the static fallback tables on /benchmarks/ still say what the
#                       JSON renders, cell for cell
#   6. msrv           — the Rust floor this site advertises still matches what
#                       libviprs declares
#
# The repo pins the CLI revision it synced from in cli/rust/COUNTERPART_REV, and
# the sync gate checks libviprs-cli out at that revision. Nothing in that job is
# allowed to pass by skipping: the checkout used to carry continue-on-error with
# the assertion guarded on its outcome, so any failure reported a warning and a
# green job, and #63 removed that. A checkout failure now fails the job. See the
# note above `sync:` for the whole story.
#
# This single workflow subsumes the retired cli-sync.yml (B6): no two workflows
# race the same triggers. cli-resync.yml is not that workflow returning — it
# opens the re-sync as a PR and duplicates no gate here, and it is separate
# because opening a pull request needs write permissions this workflow does not
# have (#58).

on:
  # No path filter: SCHEMA_V2 §5 makes these jobs REQUIRED checks on `main`, so
  # a PR that doesn't touch cli/** must still run them — otherwise the required
  # contexts sit perpetually 'Expected' and the PR can never merge. The jobs are
  # cheap, so they run on every push (B7).
  #
  # Every branch, not just `main`: a push to a PR branch has to produce a run,
  # and `pull_request` on its own does not fire while a PR is conflicted with
  # its base, which is exactly when a signal is wanted (libviprs/libviprs#585).
  push:
    branches: ['**']
  # Daily drift sweep (converged from the retired cli-sync.yml, B6): catches an
  # upstream flag rename in libviprs-cli even when no push lands in this repo.
  # The Gitea migration dropped this as GitHub-native; it is back.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. sync — byte-identical frozen copy check, and a BLOCKING gate in the
  #    literal sense: nothing in this job is allowed to pass by skipping.
  #
  #    The pin lives in cli/rust/COUNTERPART_REV, a committed file, so bumping
  #    it is a reviewable diff in the same PR as the re-synced frozen copy.
  #    It used to live only in the CLI_COUNTERPART_REV repository variable,
  #    which had two problems. The variable was never set, and an unset
  #    variable resolves to the empty string, which actions/checkout reads as
  #    "the default branch" — so the gate compared the frozen copy against
  #    whatever libviprs-cli main happened to be that morning rather than
  #    against the revision this site was frozen from. And the checkout carried
  #    continue-on-error with the assertion guarded on its outcome, so any
  #    checkout failure (a private repo, a rate limit, a bad ref) reported a
  #    warning and a green job. A gate that cannot fail is not a gate (B1).
  #    The variable survives as an override for a one-off run; the file wins
  #    when it is unset, and a checkout failure now fails the job.
  #
  #    The advisory step at the end keeps what the daily sweep was for: it says
  #    when the pin has fallen behind libviprs-cli main, as a warning, without
  #    turning an upstream merge into a red build in this repository.
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out libviprs-org (this repo)
        uses: actions/checkout@v4
        with:
          path: libviprs-org

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assert the pin is well formed and this job actually reads it
        run: node libviprs-org/cli/tools/sync-pin.test.js

      - name: Resolve the pinned counterpart revision
        id: pin
        run: |
          rev="$(tr -d '[:space:]' < libviprs-org/cli/rust/COUNTERPART_REV)"
          if ! printf '%s' "$rev" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::cli/rust/COUNTERPART_REV is not a 40-character commit sha: '$rev'"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "pinned libviprs-cli revision: $rev"

      - name: Check out canonical libviprs-cli at the pinned revision
        id: checkout_cli
        uses: actions/checkout@v4
        with:
          repository: libviprs/libviprs-cli
          path: libviprs-cli
          ref: ${{ vars.CLI_COUNTERPART_REV || steps.pin.outputs.rev }}
          # Explicit rather than left to the default, because this step reads
          # across repositories and one line naming the credential is worth it.
          #
          # It used to say `secrets.SYNC_CLI_TOKEN || github.token`, and that
          # secret has never existed (#72). This repository has exactly one
          # secret, GITEA_SYNC_TOKEN, for the Gitea mirror, and no organization
          # secret reaches it at all, so the expression always resolved to
          # github.token. libviprs-cli is public, so github.token checks it out
          # and nothing ever went wrong to notice. That is the same shape as the
          # CLI_COUNTERPART_REV repository variable #63 fixed: a name that reads
          # as configuration that nobody set. The only difference is that the
          # variable's unset value was actively wrong and this one's happened to
          # be right, which bought it a name in the file and no other effect.
          #
          # If libviprs-cli ever goes private, this is the line the credential
          # goes on, and it has to be a plain reference to a secret that exists
          # rather than a `||` fallback. A fallback here degrades in silence:
          # the checkout succeeds against a public repo and fails against a
          # private one, and only the second case tells you the secret is
          # missing. cli/tools/sync-pin.test.js now fails on any secret or
          # variable reference in .github/workflows/ that is not declared in
          # cli/tools/workflow-inputs.json, and on any optional one that does
          # not say in the log which route the run took.
          token: ${{ github.token }}

      - name: Assert frozen CLI copy is in sync with the pinned revision
        run: libviprs-org/cli/tools/sync-cli-src.sh --check

      - name: Advisory — has libviprs-cli main moved past the pin?
        continue-on-error: true
        run: |
          pinned="${{ steps.pin.outputs.rev }}"
          upstream="$(git ls-remote https://github.com/libviprs/libviprs-cli.git refs/heads/main | cut -f1)"
          if [ -z "$upstream" ]; then
            echo "::warning::could not read libviprs-cli main; skipping the drift advisory"
          elif [ "$pinned" != "$upstream" ]; then
            echo "::warning::the pin ($pinned) is behind libviprs-cli main ($upstream). cli-resync.yml opens the re-sync as a PR when the frozen copy has actually drifted; run it with workflow_dispatch to not wait for the nightly, or do it by hand with cli/tools/sync-cli-src.sh plus a bump of cli/rust/COUNTERPART_REV."
          else
            echo "pin matches libviprs-cli main ($upstream)"
          fi

  # 2. extract — regenerate the manifest (baseline §4 enforced inside the
  #    extractor) and assert no uncommitted drift; then the per-flag audit.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate snippet manifest (enforces pyramid baseline §4)
        run: cargo run --manifest-path cli/tools/extract-snippets/Cargo.toml

      - name: Assert committed JSON matches regeneration (no drift)
        run: git diff --exit-code cli/js/snippets.generated.json

      - name: Extractor unit tests
        working-directory: cli/tools/extract-snippets
        run: cargo test --quiet

  # 3. test-flags — per-flag audit gate (exit 1 if any flag produces zero diff).
  test-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Per-flag audit
        run: node cli/tools/test-flags/test.js

      - name: Flag-anchor test
        run: node cli/tools/test-flags/anchors.js

  # 4. gen-op-sections — regenerate the data-driven op sections and assert no
  #    drift (same no-drift pattern as the extract gate). Running the generator
  #    also exercises the oracle_class/shape enum validation (B5, B8), so an
  #    invalid dump fails the job.
  gen-op-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate op sections (validates oracle_class/shape enums)
        run: node cli/tools/gen-op-sections/index.js --out cli/tools/gen-op-sections/generated-op-sections.html

      - name: Assert committed HTML matches regeneration (no drift)
        run: git diff --exit-code cli/tools/gen-op-sections/generated-op-sections.html

      - name: Placeholder substitution — annotated op bodies render real values (#53)
        run: node cli/tools/gen-op-sections/placeholder-substitution.test.js

      - name: Hand-authored sections exist for every HAND_AUTHORED command
        run: node cli/tools/gen-op-sections/hand-authored.test.js

  # 5. bench-drift — /benchmarks/ is the one data-driven artifact on this site
  #    that keeps a hand-maintained duplicate of itself: three tables rendered
  #    from JSON by benchmarks/js/scalability-tables.js, and a static <tbody>
  #    in benchmarks/index.html that is what a visitor sees with JS off. Their
  #    whole contract is to say the same thing, and nothing enforced it. An
  #    unattended period left six defects in there (three stale engine labels,
  #    two stale rounded figures, one lost <code> wrapper), which is the
  #    measured drift rate for this artifact with no gate on it.
  #
  #    The check requires the renderer and compares against the models it
  #    actually paints, so there is no third copy of the formatting to drift.
  #    The test alongside it injects each of those six classes plus the pending
  #    machinery and asserts the check reports them, because a parity check
  #    whose parser matches nothing compares zero cells and passes (B1).
  #
  #    Plain Node, no dependency and no build step: #62 rules out adding one.
  bench-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static fallback tables match the JSON render
        run: node benchmarks/tools/bench-drift.js

      - name: The drift check can actually fail (injected drifts + controls)
        run: node benchmarks/tools/bench-drift.test.js

  # 6. msrv — not a docs-generator gate, so it sits outside the SCHEMA_V2 §5
  #    contract deliberately; see libviprs-org#65. It is a required check on
  #    `main` all the same, since #59 made every job here one.
  #
  #    It greps rather than builds because the number on this site is prose in
  #    an HTML page, not a manifest: there is nothing for cargo to enforce and
  #    no reason to spend a toolchain install on it. libviprs' Cargo.toml is
  #    just a file to read, and `rust-version` is the only statement of the
  #    floor that anything enforces, since it is the one cargo reads.
  #
  #    Every page, not just index.html. Only the front page states a version
  #    today, but the failure this fixes is a claim nobody is looking at, and
  #    pinning the check to one filename recreates it the moment somebody
  #    writes a floor into cli/index.html.
  #
  #    GITHUB_TOKEN is scoped to this repository and does not reach libviprs,
  #    so the clone is unauthenticated. libviprs is public and libviprs-cli's
  #    own guard clones it the same way.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone libviprs (source of truth for the Rust floor)
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs

      - name: Every advertised Rust version matches libviprs
        run: |
          core=$(grep -m1 -E '^rust-version *= *"' ../libviprs/Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/' | cut -d. -f1,2)
          advertised=$(grep -rhoE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' --include='*.html' . \
            | grep -oE '[0-9]+\.[0-9]+' | sort -u | paste -sd/ -)
          echo "core (libviprs):    $core"
          echo "advertised (pages): $advertised"
          echo "stated in:"
          grep -rlE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' --include='*.html' . | sort | sed 's/^/  /'
          rc=0
          [ -n "$advertised" ] || { echo "::error::no Rust version found in any page, so this guard has nothing to compare"; rc=1; }
          [ "$advertised" = "$core" ] || { echo "::error::this site advertises Rust $advertised+ but libviprs declares rust-version $core"; rc=1; }
          exit $rc
