name: cli-resync

# The closing step for the frozen-copy loop (#58).
#
# cli/rust/ is a byte-identical copy of libviprs-cli/src, and
# cli/rust/COUNTERPART_REV names the revision it is a copy of. The `sync` gate in
# ci.yml compares those two, so it stays green when libviprs-cli moves. That is
# deliberate: before #63 the gate resolved an unset repository variable to "the
# default branch" and compared against whatever libviprs-cli main was that
# morning, which reddened whichever PR here happened to run next rather than the
# change that caused it.
#
# Pinning fixed the bystander red and left nothing bringing the copy forward.
# ci.yml's advisory step prints a ::warning:: when the pin is behind, and a
# warning nobody reads is how the copy drifted in the first place. So this does
# the catch-up and opens it for review.
#
# THIS IS NOT THE RETIRED cli-sync.yml COMING BACK. That one was folded into
# ci.yml under B6 because it duplicated the drift sweep and raced it on the same
# triggers. Nothing here duplicates a gate: ci.yml reports drift and this writes
# the fix, which is the half ci.yml deliberately does not do. It has to be a
# separate file for a concrete reason rather than a stylistic one: ci.yml
# declares `permissions: contents: read`, and opening a pull request needs
# `contents: write` and `pull-requests: write`. Folding this in would widen the
# permissions of every gate job in the repository to get one of them a token it
# alone needs. The schedule is offset from ci.yml's so the two do not collide.
#
# Why not a blocking check on the libviprs-cli side, which is the shape #58
# originally asked for: the pin names a libviprs-cli commit, so the companion
# re-sync can only be made after that commit exists on main. A gate there would
# block the very merge it is waiting for. Recording that here so it is not
# proposed again.
#
# It opens a PR rather than pushing to main, because a re-sync moves the
# generated op-sections fragment and the published cli/index.html, which is a
# change somebody should look at.
#
# ---------------------------------------------------------------------------
# HOW THE PULL REQUEST GETS CREATED (#68). The chosen route is a PAT.
#
# `GITHUB_TOKEN` cannot open a pull request in this repository. The repo's
# "Allow GitHub Actions to create and approve pull requests" switch is off
# (`gh api repos/libviprs/libviprs-org/actions/permissions/workflow` reports
# `"can_approve_pull_request_reviews": false`), and with it off `gh pr create`
# under `GITHUB_TOKEN` fails with HTTP 422 no matter what this file declares in
# its `permissions:` block.
#
# The route taken here is the repository secret `CLI_RESYNC_TOKEN`: a
# fine-grained PAT scoped to libviprs/libviprs-org with `Contents: read and
# write` and `Pull requests: read and write`. It is used for the checkout (so
# the branch push carries it) and as `GH_TOKEN`. A PAT push starts a workflow
# run, which a `GITHUB_TOKEN` push does not, so the sync PR gets the six real
# ci.yml check runs branch protection reads and nobody has to dispatch them by
# hand.
#
# Flipping the switch instead is the other route and it still works: this file
# falls back to `github.token` when the secret is absent, and says loudly in the
# log which route a run is on. On that route the PR carries no check runs until
# someone runs `gh workflow run ci.yml --ref chore/cli-sync`, and the PR body
# says so. Whether the switch can be flipped at all is unverified: the org-level
# Actions policy could not be read (403 without `admin:org`), so it may override
# the repository setting.
#
# Either way this is an owner action. Nothing in a pull request can grant it.
# ---------------------------------------------------------------------------

on:
  schedule:
    # After libviprs-cli's own nightly at 06:11 UTC, so a CLI change and the
    # sync that follows it do not race on the same morning.
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      cli_ref:
        description: >-
          The libviprs-cli branch to sync from. Defaults to main, which is what
          the nightly uses. Point it at a throwaway branch to exercise this
          workflow end to end without merging a real drift into libviprs-cli
          main, which is how it went unexercised until #68.
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  # For the failure notice at the end. A red scheduled run is the "warning
  # nobody reads" shape #58 was about, so a failure has to land somewhere a
  # person sees.
  issues: write

concurrency:
  # Two runs would race on the same branch and the same PR.
  group: cli-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/cli-sync
  CLI_REF: ${{ inputs.cli_ref || 'main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out libviprs-org (this repo)
        uses: actions/checkout@v4
        with:
          path: libviprs-org
          fetch-depth: 0
          # The token the later push inherits. On the PAT route that push starts
          # ci.yml on the sync branch; on the GITHUB_TOKEN fallback it does not.
          token: ${{ secrets.CLI_RESYNC_TOKEN || github.token }}

      - name: Say which PR-creation route this run is on
        id: route
        env:
          CLI_RESYNC_TOKEN: ${{ secrets.CLI_RESYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLI_RESYNC_TOKEN:-}" ]; then
            echo "route=pat" >> "$GITHUB_OUTPUT"
            echo "PAT route: CLI_RESYNC_TOKEN is set, so the push starts ci.yml and the PR gets real checks."
          else
            echo "route=github_token" >> "$GITHUB_OUTPUT"
            echo "::warning::CLI_RESYNC_TOKEN is not set, so this run falls back to GITHUB_TOKEN. Opening a pull request then needs the repository's 'Allow GitHub Actions to create and approve pull requests' switch to be on, and the PR it opens will carry no check runs until someone runs: gh workflow run ci.yml --ref ${SYNC_BRANCH}. See the header comment in .github/workflows/cli-resync.yml."
          fi

      - name: Resolve the pin and libviprs-cli ${{ inputs.cli_ref || 'main' }}
        id: revs
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < libviprs-org/cli/rust/COUNTERPART_REV)"
          if ! printf '%s' "$pinned" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=cli/rust/COUNTERPART_REV::not a 40-character commit sha: '$pinned'"
            exit 1
          fi
          upstream="$(git ls-remote https://github.com/libviprs/libviprs-cli.git "refs/heads/${CLI_REF}" | cut -f1)"
          if ! printf '%s' "$upstream" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::could not read libviprs-cli ${CLI_REF}, so this run cannot tell whether the copy is stale"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$upstream" ]; then
            echo "moved=0" >> "$GITHUB_OUTPUT"
            echo "pin matches libviprs-cli ${CLI_REF} ($upstream)"
          else
            echo "moved=1" >> "$GITHUB_OUTPUT"
            echo "pin $pinned is behind libviprs-cli ${CLI_REF} $upstream"
          fi

      - name: Check out libviprs-cli at the resolved revision
        if: steps.revs.outputs.moved == '1'
        uses: actions/checkout@v4
        with:
          repository: libviprs/libviprs-cli
          path: libviprs-cli
          # The sha the step above resolved CLI_REF to, not CLI_REF itself, so a
          # push landing mid-run cannot make the pin this job writes disagree
          # with the source it copied.
          ref: ${{ steps.revs.outputs.upstream }}

      # A moved pin is not the same thing as a stale copy: most libviprs-cli
      # commits touch nothing cli/rust/ freezes. Opening a PR for every one of
      # them would be daily noise, so the drift check decides, not the sha.
      - name: Is the frozen copy actually stale?
        id: drift
        if: steps.revs.outputs.moved == '1'
        working-directory: libviprs-org
        run: |
          set -euo pipefail
          if cli/tools/sync-cli-src.sh --check; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
            echo "the frozen copy is byte-identical to libviprs-cli ${CLI_REF}; only the pin is behind"
          else
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "the frozen copy has drifted from libviprs-cli ${CLI_REF}"
          fi

      - name: Set up Node
        if: steps.drift.outputs.stale == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        if: steps.drift.outputs.stale == '1'
        uses: dtolnay/rust-toolchain@stable

      - name: Re-sync the copy and everything generated from it
        if: steps.drift.outputs.stale == '1'
        working-directory: libviprs-org
        run: |
          set -euo pipefail
          cli/tools/sync-cli-src.sh
          printf '%s\n' "${{ steps.revs.outputs.upstream }}" > cli/rust/COUNTERPART_REV
          # Stage here, not in the PR step, and this is load-bearing (#68). The
          # gates below end in `git diff --exit-code`, which without --cached
          # compares the working tree to the INDEX. A file the sync just
          # rewrote is modified-and-unstaged, so the gate exits 1 and the job
          # dies on any drift that actually reaches a snippet slot, which is
          # the only drift worth a PR. With the sync's output in the index
          # those lines mean what ci.yml means by them: regenerating again
          # reproduces what is committed.
          #
          # cli/index.html, not the root index.html. sync-cli-src.sh injects the
          # op-sections fragment into "$SCRIPT_DIR/../index.html" where
          # SCRIPT_DIR is cli/tools, and only cli/index.html carries the
          # <div id="generated-op-sections"> container. Staging the root file
          # was a silent no-op that left the published page out of the PR.
          git add cli/rust cli/js/snippets.generated.json \
                  cli/tools/gen-op-sections/generated-op-sections.html \
                  cli/index.html
          git status --short

      # The gates the sync has to satisfy before it is worth opening. Anything
      # red stops the PR being opened at all: a sync that does not satisfy the
      # gates is a report, not a patch.
      #
      # Each generator runs again here and its output is diffed against what the
      # sync staged, so these are idempotence checks. They fail when a second
      # regeneration disagrees with the first, which is a real bug.
      - name: Run the gates this change has to satisfy
        if: steps.drift.outputs.stale == '1'
        id: gates
        working-directory: libviprs-org
        run: |
          set -euo pipefail
          cli/tools/sync-cli-src.sh --check
          node cli/tools/sync-pin.test.js
          cargo run --manifest-path cli/tools/extract-snippets/Cargo.toml
          git diff --exit-code cli/js/snippets.generated.json
          node cli/tools/test-flags/test.js
          node cli/tools/test-flags/anchors.js
          node cli/tools/gen-op-sections/index.js --out cli/tools/gen-op-sections/generated-op-sections.html
          git diff --exit-code cli/tools/gen-op-sections/generated-op-sections.html
          node cli/tools/gen-op-sections/placeholder-substitution.test.js
          node cli/tools/gen-op-sections/hand-authored.test.js
          ( cd cli/tools/extract-snippets && cargo test --quiet )

      - name: Open or update the sync pull request
        if: steps.drift.outputs.stale == '1'
        working-directory: libviprs-org
        env:
          GH_TOKEN: ${{ secrets.CLI_RESYNC_TOKEN || github.token }}
          PINNED: ${{ steps.revs.outputs.pinned }}
          UPSTREAM: ${{ steps.revs.outputs.upstream }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          git config user.name "libviprs-org sync"
          git config user.email "noreply@github.com"
          # -B with no start point is HEAD, so this renames the branch under an
          # index that already holds the sync's output. Nothing is re-staged
          # below; the step above did it.
          git checkout -B "$SYNC_BRANCH"
          if git diff --cached --quiet; then
            echo "the gates left nothing staged, so there is nothing to open"
            exit 0
          fi
          git commit -m "cli: re-sync the frozen copy to libviprs-cli ${UPSTREAM:0:12}

          cli/rust/ is a byte-identical copy of libviprs-cli/src and it had
          drifted: the pin was at ${PINNED:0:12} and libviprs-cli ${CLI_REF} is
          at ${UPSTREAM:0:12}. Regenerated through cli/tools/sync-cli-src.sh,
          which also moves snippets.generated.json, the op-sections fragment and
          the copy of that fragment embedded in cli/index.html."
          git push --force-with-lease origin "$SYNC_BRANCH"

          if [ "$ROUTE" = "pat" ]; then
            checks_note="The push that created this branch was made with a PAT, so \`ci.yml\` started on it and the six required checks are real. The gates below also ran inside the job that opened this, which is belt and braces rather than the only signal:"
            dispatch_note=""
          else
            checks_note="**These gates ran in the job that opened this, and all passed.** They are here because a pull request opened with \`GITHUB_TOKEN\` does not start a workflow run, so no checks appear on this PR by themselves:"
            dispatch_note="No check runs are attached yet. Run \`gh workflow run ci.yml --ref $SYNC_BRANCH\` to get them: a dispatched run creates check runs on the branch head sha, which is what branch protection reads. Closing and reopening this PR does not work, because \`ci.yml\` has no \`pull_request\` trigger."
          fi

          body=$(cat <<EOF
          The frozen \`cli/rust/\` copy had drifted from \`libviprs-cli\` \`${CLI_REF}\`. Opened by \`.github/workflows/cli-resync.yml\`, which is the closing step for #58.

          | | |
          | --- | --- |
          | pin was | \`$PINNED\` |
          | libviprs-cli \`${CLI_REF}\` | \`$UPSTREAM\` |

          Regenerated with \`cli/tools/sync-cli-src.sh\`, which moves the frozen sources, \`cli/js/snippets.generated.json\`, the op-sections fragment, and the copy of that fragment embedded in \`cli/index.html\`.

          $checks_note

          - \`cli/tools/sync-cli-src.sh --check\`
          - \`node cli/tools/sync-pin.test.js\`
          - the extractor regenerates and \`git diff --exit-code cli/js/snippets.generated.json\` is clean
          - \`node cli/tools/test-flags/test.js\` and \`anchors.js\`
          - \`gen-op-sections\` regenerates and \`git diff --exit-code\` is clean
          - \`placeholder-substitution.test.js\` and \`hand-authored.test.js\`
          - \`cargo test\` in \`cli/tools/extract-snippets\`

          If the sync had failed any of them this PR would not exist: the job stops before opening it.

          $dispatch_note
          EOF
          )

          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            # --state open matters. `gh pr view <branch>` resolves closed and
            # merged PRs too, so the old form took this arm forever once one
            # sync PR had been merged: it rewrote the body of a dead PR and
            # never opened another (#68).
            gh pr edit "$existing" --body "$body"
            echo "updated the open sync PR #$existing"
          elif gh pr create --base main --head "$SYNC_BRANCH" \
              --title "cli: re-sync the frozen copy to libviprs-cli ${UPSTREAM:0:12}" \
              --body "$body"; then
            echo "opened a new sync PR"
          else
            echo "::error::could not open the pull request. The branch $SYNC_BRANCH is pushed and carries the re-sync, so nothing is lost, but it needs a PR opened by hand. On the GITHUB_TOKEN route this is HTTP 422 'GitHub Actions is not permitted to create or approve pull requests': set the CLI_RESYNC_TOKEN secret, or turn on the repository's 'Allow GitHub Actions to create and approve pull requests' switch. See the header comment in .github/workflows/cli-resync.yml."
            exit 1
          fi

      # A failed run used to show up only as a red square in the Actions tab,
      # which is the same warning-nobody-reads shape #58 was filed about. The
      # likeliest failure is hand-authored.test.js, the moment libviprs-cli adds
      # a command with no hand-written section yet, and that needs a person.
      - name: A failure has to be visible somewhere other than the Actions tab
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CLI_RESYNC_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="cli-resync is failing"
          body="\`.github/workflows/cli-resync.yml\` failed, so the frozen \`cli/rust/\` copy is not being brought forward.

          Last failing run: $RUN_URL (libviprs-cli ref \`${CLI_REF}\`).

          The usual cause is a gate that the re-sync cannot satisfy on its own. \`hand-authored.test.js\` is the likeliest: libviprs-cli has added a command that has no hand-written section here yet, and somebody has to write it. Re-run the workflow after fixing it, or dispatch it with a \`cli_ref\` to test against a branch.

          This issue is opened once and its body is rewritten on each later failure, so it stays a single thread. Close it when the run is green."
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "updated the open failure issue #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi
